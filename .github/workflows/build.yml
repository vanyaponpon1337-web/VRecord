name: VRecord CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcode-select --print-path

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project VRecord.xcodeproj -scheme VRecord

      - name: Build
        run: >-
          xcodebuild
          -project VRecord.xcodeproj
          -scheme VRecord
          -sdk iphoneos
          -configuration Debug
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          build

      - name: Test
        run: >-
          xcodebuild
          -project VRecord.xcodeproj
          -scheme VRecord
          -sdk iphonesimulator
          -configuration Debug
          -destination 'platform=iOS Simulator,name=iPhone 16 Pro'
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          test
